# =============================================================================
# nginx config for w1913.com on the droplet (graceful-monet) — a RECORD.
# =============================================================================
#
# Where it lives: Forge → w1913.com site → Nginx settings, which edits
#   /etc/nginx/forge-conf/3524816/site.conf   (3524816 is the Forge site id)
# The file in sites-available/w1913.com only holds the server block and the
# certificate; Forge includes this file inside it. The www → w1913.com and
# http → https redirects are Forge's own (forge-conf/3524816/w1913.com/before/).
#
# This copy is documentation: nginx does not read it from the repository.
# Change the live file in Forge, then update this copy in the same commit as
# any code change that needs it. Last applied: 27 Nov 2026 (Phase 1).
#
# If the site's port changes in w1913.config.ts (server.port), change
# proxy_pass below IN THE SAME DEPLOY, or the site goes down.
# =============================================================================

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
# Not yet (add once HTTPS has run for a while; no includeSubDomains/preload):
# add_header Strict-Transport-Security "max-age=63072000" always;

charset utf-8;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3524816/server/*;

# W1913 is a read-only site: no uploads, small requests only.
client_max_body_size 16k;

# Everything goes to the Nuxt server (PM2 "w1913", port from w1913.config.ts).
# Static files (fonts, favicon) are served by Nuxt too, with their cache
# headers set in apps/site/nuxt.config.ts (routeRules).
location / {
    proxy_pass http://127.0.0.1:3913;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Forge's default favicon.ico / favicon.svg / robots.txt locations were
# REMOVED on purpose: they look for files in /home/forge/w1913.com/public,
# which does not exist, so they returned 404. Nuxt serves those files.

access_log off;
error_log  /var/log/nginx/3524816-error.log error;

location ~ /\.(?!well-known).* {
    deny all;
}

# Later (DESIGN.md §3): a page cache and a rate limit. Both need lines at the
# http level, in /etc/nginx/conf.d/w1913.conf (sudo), e.g.
#   proxy_cache_path /var/cache/nginx/w1913 levels=1:2 keys_zone=w1913:20m max_size=1g inactive=7d use_temp_path=off;
#   limit_req_zone $binary_remote_addr zone=w1913_req:10m rate=10r/s;
# and then, inside location / above:
#   proxy_cache w1913; proxy_cache_valid 200 1d;
#   proxy_cache_use_stale error timeout updating http_502 http_503;
#   limit_req zone=w1913_req burst=40 nodelay;
# rebuild.sh empties the cache after a deploy when W1913_NGINX_CACHE is set.
